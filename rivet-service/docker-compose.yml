# Перед первым запуском: cp .env.example .env и заполните пароль
# администратора и ключ шифрования. Без них стенд не стартует.
#
# Runner'ы подключаются с хоста: выпустите токен регистрации в консоли
# («Управление приложением» → «Runner'ы») для идентификаторов runner'ов,
# сохраните его в файл с правами 0600 и запустите
#   RIVET_RUNNER_TOKEN_FILE=~/.rivet/runner.token rivet-runner -plane localhost:8090 -id <идентификатор> \
#     [-tls -tls-ca ca.pem [-tls-cert runner.pem -tls-key runner-key.pem]]
services:
  rivetd:
    build:
      context: .
      args:
        VERSION: ${RIVET_VERSION:-dev}
        # Коммит сборки для ссылки на исходники (GET /api/v1/about):
        # make image передаёт git rev-parse HEAD.
        COMMIT: ${RIVET_COMMIT:-}
    ports:
      # Только loopback: gRPC без TLS несёт токен runner'а открытым текстом,
      # наружу не публикуем.
      - "127.0.0.1:8080:8080"   # REST API + встроенная веб-консоль
      - "127.0.0.1:8090:8090"   # gRPC для runner'ов (подключаются с хоста)
    environment:
      RIVET_DATABASE_URL: postgres://rivet:rivet@postgres:5432/rivet?sslmode=disable
      RIVET_S3_ENDPOINT: s3:9000
      # Необязательные секреты пробрасываются из окружения хоста / .env.
      RIVET_GITHUB_TOKEN: ${RIVET_GITHUB_TOKEN:-}
      RIVET_GITHUB_WEBHOOK_SECRET: ${RIVET_GITHUB_WEBHOOK_SECRET:-}
      # По умолчанию fake: с github без RIVET_GITHUB_TOKEN конвейер падает на CreatePR.
      # Для реальных PR задай RIVET_SCM=github и RIVET_GITHUB_TOKEN в окружении/.env.
      RIVET_SCM: ${RIVET_SCM:-fake}
      # Ключ шифрования секретов установки: токенов хостингов и ключей
      # моделей (32 байта base64). Обязателен и своего значения по
      # умолчанию не имеет: ключ из примера знал бы любой.
      RIVET_SECRET_KEY: ${RIVET_SECRET_KEY:?задайте RIVET_SECRET_KEY в .env (см. .env.example), ключ генерирует openssl rand -base64 32}
      # Внешний адрес установки: нужен, чтобы система сама регистрировала
      # webhook на хостинге. Пусто — данные для ручной настройки в консоли.
      RIVET_PUBLIC_URL: ${RIVET_PUBLIC_URL:-}
      # Bootstrap первого администратора (rivetd не стартует без владельца).
      # Пароль обязателен, не короче 8 символов, пароли из документации
      # rivetd не принимает. Когда пользователи уже есть, пароль не читается.
      RIVET_ADMIN_LOGIN: ${RIVET_ADMIN_LOGIN:-admin}
      RIVET_ADMIN_PASSWORD: ${RIVET_ADMIN_PASSWORD:?задайте RIVET_ADMIN_PASSWORD в .env (см. .env.example), не короче 8 символов, например openssl rand -base64 18}
      # Адрес исходного кода для ссылки «Исходный код» (форк указывает свой
      # репозиторий). Пусто значит адрес из сборки.
      RIVET_SOURCE_URL: ${RIVET_SOURCE_URL:-}
      # Ключ модели для декомпозиции из окружения — запасной источник: ключ,
      # заданный в консоли («Управление приложением» → «Модели»), имеет приоритет.
      RIVET_LLM_PROVIDER: ${RIVET_LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # TLS протокола runner'ов (необязательно): PEM-файлы сертификата и ключа,
      # смонтированные в контейнер. Без них порт 8090 держите за периметром.
      # rivetd в контейнере работает от uid 10001: файл ключа должен читаться
      # им (chown 10001 или группа и права 0640).
      RIVET_GRPC_TLS_CERT: ${RIVET_GRPC_TLS_CERT:-}
      RIVET_GRPC_TLS_KEY: ${RIVET_GRPC_TLS_KEY:-}
      # mTLS (необязательно, только вместе с TLS): корни клиентских
      # сертификатов runner'ов. CN или DNS SAN сертификата должен совпадать
      # с идентификатором runner'а. Пусто: клиентские сертификаты не
      # проверяются, rivetd предупреждает об этом в журнале.
      RIVET_GRPC_CLIENT_CA: ${RIVET_GRPC_CLIENT_CA:-}
    depends_on:
      postgres:
        condition: service_healthy
      # service_healthy обязательно: rivetd проверяет S3 один раз на старте
      # и при недоступности отключает blob store до перезапуска.
      s3:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: rivet
      POSTGRES_DB: rivet
    ports:
      # Только loopback: dev-credentials не должны светиться в сеть.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet"]
      interval: 2s
      timeout: 2s
      retries: 15

  s3:
    # S3 для транскриптов. RustFS вместо MinIO: образы MinIO убраны с Docker Hub
    # и Quay. Тег закреплён: latest менял бы поведение без правок кода.
    image: rustfs/rustfs:1.0.3
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: rivet
      RUSTFS_SECRET_KEY: rivetsecret
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      # Только loopback: dev-credentials не должны светиться в сеть.
      - "127.0.0.1:9000:9000"
    volumes:
      # Новый том: формат данных MinIO не переносим, старый miniodata не трогаем.
      - s3data:/data

volumes:
  pgdata:
  s3data:
