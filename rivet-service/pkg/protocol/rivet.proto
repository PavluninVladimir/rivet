// SPDX-License-Identifier: Apache-2.0
// Протокол runner'ов выходит под Apache-2.0, а не под AGPL остального Rivet:
// runner'ы и клиенты протокола можно писать под любой лицензией (LICENSE в
// этом каталоге).
//
// Протокол runner ↔ control plane (см. design и api-contract изменения
// define-rivet-architecture). Соединение всегда исходящее от runner'а.
// Доставка at-least-once: каждое сообщение несёт msg_id, приём подтверждается
// Ack, дедупликация на стороне получателя.
syntax = "proto3";

package rivet.v1;

option go_package = "github.com/PavluninVladimir/rivet/pkg/protocol";

service RunnerService {
  // Register объявляет runner control plane'у (идемпотентно).
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Channel — единственный двунаправленный поток сообщений.
  // Первое сообщение runner'а — Hello.
  rpc Channel(stream RunnerMsg) returns (stream PlaneMsg);
}

message RegisterRequest {
  string runner_id = 1;
  string agent = 2;
  string model = 3;
  string host = 4;
  repeated string capabilities = 5;
  string protocol_version = 6;
  // Адаптер подключения агента (native у агента Rivet, пусто у runner'а
  // выкатки; claude-code и wrap только у старых runner'ов) и глубина
  // данных, которую он даёт: full | partial | minimal (спека
  // agent-integration «Уровни глубины данных»). Сессии runner'а создаются
  // с этой глубиной.
  string adapter = 7;
  string depth = 8;
  // Поддерживает ли адаптер обратный канал контекста (PlaneMsg.Context):
  // агент Rivet доводит контекст до модели, старая обёртка — нет, и таким
  // runner'ам control plane контекст не шлёт (спека agent-integration
  // «Обратный канал контекста»).
  bool context_channel = 9;
  // Поддерживаемые модели (протокол v11, спека runners «Регистрация»):
  // модель сессии приходит в Assignment.model. Пустой список — control plane
  // берёт model как список из одного элемента (runner'ы v10).
  repeated string models = 10;
  // Стадии, которые runner исполняет (add-process-editor): пустой список
  // у старых runner'ов означает четыре стадии без PROMPT.
  repeated string stages = 11;
  // Отображаемое имя runner'а (add-agent-roles, спека agent-roles «Имя
  // агента»): флаг -name при запуске. Имя, заданное администратором в
  // консоли, имеет приоритет и регистрацией не перезаписывается.
  string display_name = 12;
  // Возможности runner'а сверх версии протокола: "roles" — runner передаёт
  // инструкцию роли агенту и выполняет сессию тестировщика на TESTING.
  // Аддитивно, версия протокола не меняется.
  repeated string features = 13;
  // Идентификатор поколения стадий runner'а, новый при каждом подключении:
  // стадии привязаны к каналу, и смена при регистрации значит, что открытые
  // стадии runner'а потеряны и назначаются заново (add-agent-roles).
  string boot_id = 14;
  // Сессии, результаты которых лежат в журнале runner'а и ещё не
  // доставлены: перезапущенный runner проиграет их, такие запуски control
  // plane не снимает.
  repeated string pending_sessions = 15;
  // Команды агента идут в песочнице без сети (add-native-agent): runner
  // объявляет, поднялась ли песочница; консоль показывает runner'ы, чьи
  // команды идут с доступом в сеть. Номер с запасом под соседние change'ы.
  bool network_isolated = 40;
}

message RegisterResponse {
  // Несовместимая версия протокола — понятная ошибка, не разрыв соединения.
  bool accepted = 1;
  string message = 2;
  int32 heartbeat_interval_s = 3;
  // Протокол v12 (add-agent-profiles): агент runner'а есть в каталоге
  // профилей и канал runner'а признан защищённым (TLS или loopback).
  bool catalog = 4;
  bool secure = 5;
}

message RunnerMsg {
  string msg_id = 1; // uuid, база дедупликации и Ack
  oneof kind {
    Hello hello = 2;
    Heartbeat heartbeat = 3;
    AgentEvent event = 4;
    TranscriptChunk transcript = 5;
    Usage usage = 6;
    StageResult stage_result = 7;
    BlockedQuestion blocked = 8;
    DeployResult deploy_result = 9;
    MonitorResult monitor_result = 10;
    HostJobResult host_job_result = 11;
  }
}

message Hello {
  string runner_id = 1;
}

message Heartbeat {
  // Отсутствие поля = заполненность контекста неизвестна (агент не отчитался).
  optional int32 ctx_pct = 1;
}

// AgentEvent — шаг агента для live-наблюдения (session.step).
// text — обязательное читаемое представление; структурированные поля
// заполняет адаптер полной глубины (спека agent-integration «Шаги сессии
// и затронутые файлы»).
message AgentEvent {
  string task_id = 1;
  string text = 2;
  string session_id = 3; // сессия стадии из Assignment
  string kind = 4;           // tool | stop | note; пусто — простой текстовый шаг
  string tool = 5;           // имя инструмента агента (kind=tool)
  string detail = 6;         // краткий аргумент: команда, путь, шаблон
  repeated string files = 7; // затронутые файлы шага (пути от корня рабочей копии)
  bool ok = 8;               // false — шаг завершился ошибкой
}

message TranscriptChunk {
  string task_id = 1;
  int64 seq = 2;
  bytes data = 3;
  string session_id = 4; // сессия стадии из Assignment; несовпадение — сообщение отбрасывается
  string deploy_id = 5;  // вывод деплой-джобы: заполняется вместо task_id/session_id
}

// Usage — отчёт о расходе за стадию. Отсутствие optional-поля означает
// «данных нет» (агент не отчитался маркером USAGE:), а не ноль.
message Usage {
  string task_id = 1;
  string session_id = 8; // сессия стадии из Assignment
  string model = 2;
  optional int64 tokens_in = 3;
  optional int64 tokens_out = 4;
  optional double cost_usd = 5;
  int32 duration_s = 6;
  optional int32 ctx_pct = 7;
  // Кешированный вход (чтение из кеша провайдера) и запись в кеш, входят в
  // tokens_in (add-native-agent, спека native-agent «Наблюдаемость»).
  // Номера с запасом под соседние change'ы.
  optional int64 tokens_cached = 40;
  optional int64 tokens_cache_write = 41;
}

// StageResult — детерминированный итог этапа конвейера.
message StageResult {
  string task_id = 1;
  Stage stage = 2;
  bool ok = 3;
  string detail = 4;   // вывод тестов, вердикт review, url PR
  string pr_url = 5;   // для stage=CODING при создании PR
  string session_id = 6; // сессия стадии из Assignment
  string policy_hash = 7; // эхо Assignment.policy.hash: итог стадии привязан к версии
  // Эхо шага процесса и участника из Assignment (change add-process-model).
  string step_id = 8;
  string participant = 9;

  enum Stage {
    STAGE_UNSPECIFIED = 0;
    CODING = 1;  // реализация завершена (ok) или невосстановимая ошибка (!ok)
    TESTING = 2; // проверки прошли/упали
    REVIEW = 3;  // вердикт независимого ревьюера
    FIXING = 4;  // исправление готово
    PROMPT = 5;  // шаг prompt: задание из процесса, вердикт маркером
  }
  // Вердикт шага prompt: ok | changes | fail (пусто для остальных стадий).
  string verdict = 10;
}

// BlockedQuestion — агент не может продолжить без человека.
message BlockedQuestion {
  string task_id = 1;
  string question = 2;
  string session_id = 3; // сессия стадии из Assignment
}

message PlaneMsg {
  string msg_id = 1;
  oneof kind {
    Ack ack = 2;
    Assignment assign = 3;
    Answer answer = 4;
    CancelTask cancel = 5;
    PauseRunner pause = 6;
    DeployJob deploy = 7;
    Context context = 8;
    MonitorJob monitor = 9;
    HostJob host_job = 10;
  }
}

// Context — контекст работающему агенту от control plane (обратный канал):
// предупреждение о пересечении работ и т.п. Доставляется во время
// выполняющейся стадии, работу не прерывает и результат не отменяет.
// Отправляется только runner'ам, объявившим context_channel.
message Context {
  string task_id = 1;
  string session_id = 2; // сессия стадии из Assignment
  string kind = 3;       // вид контекста: overlap
  string text = 4;       // готовое сообщение агенту
}

message Ack {
  string acked_msg_id = 1;
}

// Assignment — задача этапу runner'а: кодирование, тесты, review или фикс.
message Assignment {
  string task_id = 1;
  int64 task_num = 2;
  StageResult.Stage stage = 3;
  string title = 4;
  string description = 5;
  repeated string criteria = 6;
  string repo = 7;   // owner/name
  string branch = 8; // agent/task-<num>
  repeated Check checks = 9;
  string extra_context = 10; // замечания review при FIXING, diff при REVIEW и т.п.
  // Сессия стадии: runner повторяет session_id во всех сообщениях стадии
  // (Transcript, Usage, StageResult, Blocked); replay с чужим id отбрасывается.
  string session_id = 11;
  // Репозиторий проекта: адрес клонирования без секрета и токен доступа.
  // Токен уезжает в git через askpass-хелпер, а не аргументом команды.
  // Пустой repo_url — старое поведение по RIVET_GIT_BASE (e2e-стенд).
  string repo_url = 12;
  string git_token = 13;
  string base_branch = 14; // базовая ветка проекта
  // Промпт пользователя (сессия доработки, add-user-sessions): при
  // непустом значении runner использует его как промпт агента вместо
  // сгенерированного промпта стадии.
  string user_prompt = 15;
  // Действующая политика проекта на момент назначения (спека access-policy
  // «Доставка политик runner'ам»): runner применяет только её и не читает
  // политику из рабочей копии. Поле пустое, только если политику не удалось
  // прочитать: у проекта без своих версий действуют значения установки, и
  // хэш у них тоже есть.
  Policy policy = 16;
  // Процесс проекта (change add-process-model, спека process): модель, с
  // которой агент запускает сессию (пусто — модель runner'а по умолчанию),
  // шаг и участник, которые runner возвращает эхом в StageResult.
  string model = 17;
  string step_id = 18;
  string participant = 19;
  // Текст задания шага prompt (add-process-editor).
  string step_prompt = 20;
  // Запуск агента по профилю каталога (протокол v12, add-agent-profiles,
  // спека agents «Доставка модели и учётных данных runner'у»): переменные
  // окружения и аргументы по шаблону профиля, команда обёртки, подключение
  // модели. Секреты включены только по режиму профиля и каналу runner'а;
  // runner накладывает окружение поверх своего и маскирует секреты.
  // Поля 21–23 и 26 устарели (add-native-agent): у агента Rivet нет команды,
  // аргументов и окружения CLI, модель приходит в endpoint. Номера не
  // переиспользуются.
  map<string, string> agent_env = 21 [deprecated = true];
  repeated string agent_args = 22 [deprecated = true];
  string agent_command = 23 [deprecated = true];
  string connection_id = 24;
  bool secrets_included = 25;
  // Имена переменных с секретами: runner маскирует их значения в транскрипте.
  repeated string agent_secret_names = 26 [deprecated = true];
  // Роль участника (add-agent-roles, спека agent-roles «Инструкция роли в
  // назначении»): runner ставит блок роли перед заданием стадии. На стадии
  // TESTING роль включает сессию тестировщика перед проверками проекта.
  AgentRole role = 27;
  // Шаблоны тестовых файлов проекта: сессия тестировщика может менять только
  // их, остальные правки откатываются (спека process «Шаг test с
  // тестировщиком»).
  repeated string test_paths = 28;
  // Модель агента Rivet (add-native-agent, design решение 2): тип API,
  // адрес, модель, окно и цены из каталога, лимиты сессии из профиля rivet,
  // ключ — только по режиму секретов. Номер с запасом: соседние change'ы
  // добавляют поля в те же сообщения.
  ModelEndpoint endpoint = 40;
}

// ModelEndpoint — подключение модели для агентского цикла Rivet.
message ModelEndpoint {
  // openai (Chat Completions) | anthropic (Messages).
  string api = 1;
  string base_url = 2;
  string model = 3;
  int32 context_window = 4;
  // Предел ответа на ход и предельный выход модели (потолок повтора хода
  // с обрезанным вызовом); 0 — по умолчанию цикла.
  int32 max_output_tokens = 5;
  int32 model_max_output = 6;
  // Цены за миллион токенов, USD; has_prices = false — цен нет.
  bool has_prices = 7;
  double input_price = 8;
  double output_price = 9;
  double cached_input_price = 10;
  SessionLimits limits = 11;
  string connection_id = 12;
  // Ключ и секретные заголовки — только при secrets_included назначения.
  string key = 13;
  map<string, string> headers = 14;
}

// SessionLimits — лимиты сессии агента; 0 — по умолчанию цикла.
message SessionLimits {
  int32 max_turns = 1;
  int64 max_tokens = 2;
  int32 max_minutes = 3;
}

// AgentRole — роль исполнителя стадии: идентификатор и название из каталога,
// имя runner'а и инструкция агенту на момент назначения.
message AgentRole {
  string id = 1;
  string title = 2;
  string name = 3;
  string instruction = 4;
}

// Policy — часть политики, которая что-то значит для агента стадии.
// Лимиты, бюджеты и авто-merge применяются на control plane и сюда не
// едут: обещать принуждение, которого у runner'а нет, не нужно.
message Policy {
  string hash = 1;                     // хэш версии действующей политики
  repeated string human_review_paths = 2; // пути, правки в которых требуют человека
  string policy_dir = 3;               // каталог файлов политики (менять запрещено)
}

message Check {
  string name = 1;
  string cmd = 2;
}

message Answer {
  string task_id = 1;
  string text = 2;
}

message CancelTask {
  string task_id = 1;
}

message PauseRunner {
  bool drain = 1;
}

// DeployJob — публикация окружения (спека backend/deployment): runner
// с capability deploy исполняет deploy_cmd/verify_cmd как shell-скрипт
// с переменными RIVET_REPO/VERSION/PREV_VERSION/ENV — по ssh на host или
// локально при пустом host. Откат — та же джоба с rollback=true и
// version=prev (деплой идемпотентен по версии).
message DeployJob {
  string deployment_id = 1;
  string env_name = 2;
  string repo = 3;      // owner/name
  string version = 4;   // sha публикуемого коммита
  string prev_version = 5;
  bool rollback = 6;
  string host = 7;      // [user@]hostname[:port]; пусто — локальное исполнение
  string deploy_cmd = 8;
  string verify_cmd = 9;
  string verify_url = 10;
  int32 timeout_s = 11; // дедлайн джобы на runner'е
  // Рабочая копия репозитория на версии публикации: нужна доставке,
  // которая применяет файлы репозитория (манифесты Kubernetes, чарт).
  // Пустой repo_url — команды исполняются в рабочем каталоге runner'а,
  // как у доставки на Linux-хост.
  bool checkout = 12;
  string repo_url = 13;
  string git_token = 14;
  // Закреплённый ключ хоста (строки known_hosts): ssh проверяет ключ по нему,
  // а не по known_hosts runner'а (add-environment-provisioning). Пусто:
  // прежнее поведение.
  string host_key = 15;
}

// DeployResult — итог этапа публикации; чужой/stale deployment_id
// отбрасывается CAS-переходами статусов.
message DeployResult {
  string deployment_id = 1;
  Stage stage = 2;
  bool ok = 3;
  string detail = 4;   // хвост вывода команд / причина
  bool rollback = 5;   // эхо DeployJob.rollback: результат фазы отката

  enum Stage {
    STAGE_UNSPECIFIED = 0;
    DEPLOY = 1;
    VERIFY = 2;
  }
}

// MonitorJob — проверка наблюдения окружения (add-sdlc-cycle, спека
// operations): runner исполняет check_cmd так же, как команды выкатки
// (рабочий каталог, host), а при провале logs_cmd. Получают только
// runner'ы, объявившие feature "monitor".
message MonitorJob {
  string check_id = 1;
  string env_name = 2;
  string host = 3;      // [user@]hostname[:port]; пусто — локальное исполнение
  string check_cmd = 4;
  string logs_cmd = 5;  // пусто — логи не читаются
  int32 timeout_s = 6;  // дедлайн команды проверки (и URL-проверки)
  string repo = 7;      // owner/name, для RIVET_REPO
  // URL проверки без команды (окружение с собственной доставкой): GET с
  // сети runner'а, ответ 2xx. Только runner'ам с feature monitor_url.
  string check_url = 8;
  int32 logs_timeout_s = 9; // дедлайн команды логов
  // Общий бюджет проверки: команда, логи и их завершение. Control plane
  // ждёт результат по тому же бюджету с запасом на доставку.
  int32 budget_s = 10;
  string host_key = 11; // закреплённый ключ хоста, как в DeployJob
}

// MonitorResult — итог проверки; вывод уже замаскирован построчно.
message MonitorResult {
  string check_id = 1;
  bool ok = 2;
  string output = 3;    // хвост вывода check_cmd
  string logs = 4;      // хвост вывода logs_cmd (только при провале)
  int64 duration_ms = 5;
}

// HostJob: задание хоста окружения (add-environment-provisioning):
// первичная настройка сервера от провайдера или снятие локального
// окружения. Исполняет runner с capability deploy, объявивший возможность
// host_jobs; задание runner не занимает. Скрипт идёт так же, как команды
// выкатки: по ssh на host или локально при пустом host.
message HostJob {
  string job_id = 1;
  string env_name = 2;
  string host = 3;              // [user@]address; пусто: локально
  string script = 4;
  int32 timeout_s = 5;          // дедлайн задания
  // Первое подключение к новому серверу: ключ хоста принимается в пустой
  // known_hosts задания и возвращается в HostJobResult.host_key.
  bool accept_new_host_key = 6;
  string host_key = 7;          // закреплённый ключ хоста
  map<string, string> env = 8;  // переменные скрипта (RIVET_*, COMPOSE_PROJECT_NAME)
  int32 ssh_wait_s = 9;         // сколько ждать SSH нового сервера перед скриптом
}

// HostJobResult: итог задания хоста; чужой или устаревший job_id
// отбрасывается control plane.
message HostJobResult {
  string job_id = 1;
  bool ok = 2;
  string output = 3;            // хвост вывода, замаскирован
  string host_key = 4;          // строки known_hosts, принятые при первом подключении
}
