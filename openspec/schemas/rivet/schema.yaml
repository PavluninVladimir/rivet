name: rivet
version: 1
description: Процесс Rivet — proposal → specs → design → api-contract → tasks; мульти-репо (Go-бэкенд rivet + rivet-web/android/ios), артефакты на русском
artifacts:
  - id: proposal
    generates: proposal.md
    description: Предложение изменения — зачем оно нужно и что меняется
    template: proposal.md
    instruction: >
      Создай proposal, отвечающий на вопрос ЗАЧЕМ нужно изменение. Пиши по-русски.


      Разделы:

      - **Зачем**: 1–2 предложения о проблеме или возможности. Почему сейчас?

      - **Что меняется**: список изменений. Конкретно: новые capabilities,
      модификации, удаления. Ломающие изменения помечай **BREAKING**.

      - **Capabilities**: какие спеки создаются или меняются:
        - **New Capabilities**: новые capability. Каждая станет `specs/<capability-path>/spec.md`. Пути — kebab-case, раскладка двухуровневая: `backend/<capability>` для серверной части и `clients/<capability>` для устройств (web-console, mobile).
        - **Modified Capabilities**: существующие capability, у которых меняются ТРЕБОВАНИЯ (не детали реализации). Точный существующий путь из `openspec/specs/`. Если требования не меняются — оставь пустым.
      - **Затронутые репозитории**: какие из четырёх репозиториев затрагивает
      изменение — `rivet` (Go-бэкенд, оркестратор), `rivet-web` (React-консоль),
      `rivet-android`, `rivet-ios`. Клиентские репозитории затрагиваются, если
      меняется видимое им поведение или API.

      - **Impact**: затронутый код, API, зависимости, системы.


      ВАЖНО: раздел Capabilities — контракт между proposal и specs: каждая
      перечисленная capability потребует spec-файла. Перед заполнением изучи
      существующие спеки в `openspec/specs/`.


      Изменение обязано либо объявить хотя бы одну capability (новую или
      изменённую), либо явно отказаться от спек: `openspec validate` отклоняет
      изменение без дельт, если в `.openspec.yaml` изменения не выставлен
      `skip_specs: true`. Используй `skip_specs: true` только когда поведение
      не меняется (рефакторинг, tooling, документация). Не выдумывай
      требование ради валидации.


      Кратко (1–2 страницы). «Зачем», а не «как» — реализация описывается в design.md.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Delta-спеки — что система должна делать
    template: spec.md
    instruction: >
      Создай spec-файлы, определяющие ЧТО должна делать система. Текст — русский;
      структурные заголовки — английские (их парсит инструмент).


      Спека — контракт поведения, не план реализации. В спеку входит: наблюдаемое
      поведение, входы/выходы/ошибки, внешние ограничения, проверяемые сценарии.
      В спеку НЕ входит: имена классов/функций, выбор библиотек, пошаговые планы.
      Быстрый тест: если реализацию можно поменять без изменения наблюдаемого
      поведения — этому не место в спеке.


      Для Rivet дополнительно: требования формулируй так, чтобы они не зависели
      от клиента (web/android/ios показывают одно и то же поведение системы);
      различия клиентов фиксируй отдельными требованиями. Держи главный принцип:
      переходы и правила — детерминированный control plane, модель работает
      только внутри задачи.


      Один spec-файл на каждую capability из proposal:

      - новые: `specs/<capability-path>/spec.md`, путь kebab-case, двухуровневый (`backend/…` или `clients/…`);

      - изменяемые: точный существующий путь из `openspec/specs/<capability-path>/`,
      не перемещать и не переименовывать.


      Дельта-операции (заголовки ##):

      - **ADDED Requirements** — новые требования

      - **MODIFIED Requirements** — изменённое поведение, ОБЯЗАТЕЛЬНО полный
      обновлённый текст требования (скопируй весь блок из основной спеки и правь)

      - **REMOVED Requirements** — с **Reason** и **Migration**

      - **RENAMED Requirements** — только переименование, формат FROM:/TO:


      Формат:

      - Требование: `### Requirement: <название>` + текст с нормативным
      «ДОЛЖЕН» / «НЕ ДОЛЖЕН» (русский эквивалент SHALL; предупреждение
      валидатора про SHALL/MUST для русских спек допустимо)

      - Сценарий: `#### Scenario: <название>` с **WHEN**/**THEN**

      - КРИТИЧНО: у сценария ровно 4 решётки (`####`), иначе он молча теряется

      - У каждого требования — минимум один сценарий; каждый сценарий —
      потенциальный тест


      Только для новых capability: начни дельту с `## Purpose` — 1–2 предложения
      (от 50 символов) о назначении capability. Для существующих capability
      `## Purpose` в дельту не добавляй.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Технические решения — как реализовать изменение
    template: design.md
    instruction: >
      Создай design-документ о том, КАК реализовать изменение. Пиши по-русски.


      Когда design.md нужен (достаточно одного условия): изменение сквозное
      (несколько модулей/репозиториев), новый архитектурный паттерн или внешняя
      зависимость, заметные изменения модели данных, сложность в безопасности /
      производительности / миграции, неоднозначность, требующая решений до кода.
      Для тривиальных изменений design.md можно не создавать.


      Разделы: **Контекст** (только текущее состояние и ограничения; за
      мотивацией отсылай к proposal.md), **Цели / Не-цели**, **Решения**
      (каждое — с обоснованием и рассмотренными альтернативами), **Риски /
      Компромиссы** (формат: [Риск] → Смягчение), **План миграции** (если
      применимо), **Открытые вопросы** (только то, что можно безопасно решить
      позже, не меняя спек, подхода и разбиения на задачи; иначе — решай сейчас,
      спросив пользователя).


      Для Rivet дополнительно:

      - если изменение затрагивает консоль — раздел **Сверка с дизайн-прототипом**:
      что берётся из `agent-orchestration-console.html` как есть, а где и почему
      решено отклониться;

      - если изменение затрагивает несколько репозиториев — порядок выката
      (совместимость бэкенда со старыми клиентами).
    requires:
      - proposal
  - id: api-contract
    generates: api-contract.md
    description: Контракт API между Go-бэкендом и клиентами (web/android/ios)
    template: api-contract.md
    instruction: >
      Создавай api-contract.md ТОЛЬКО если изменение добавляет или меняет API
      между бэкендом (rivet) и клиентами (rivet-web, rivet-android, rivet-ios) —
      эндпоинты, события реального времени, схемы данных. Если API не
      затрагивается — артефакт не нужен, пропусти его и сообщи об этом.


      Пиши по-русски. Контракт — источник истины для всех трёх клиентов:

      - **Операции**: каждый новый/изменённый эндпоинт или событие — метод, путь
      (или имя события), назначение, схема запроса и ответа, ошибки;

      - **Модели данных**: изменяемые DTO с полями и типами; помечай
      обязательность и допустимые значения (например, статусы задач);

      - **Совместимость**: ломающие изменения помечай **BREAKING** и описывай
      стратегию (версия, депрекация, окно совместимости со старыми мобильными
      клиентами — им нельзя мгновенно обновиться);

      - **Реальное время**: для живых данных (статусы, live-лог, лента событий)
      укажи механизм доставки и поведение при переподключении.


      Не дублируй требования из спек — ссылайся на них; здесь только форма
      контракта, не мотивация.
    requires:
      - specs
      - design
  - id: tasks
    generates: tasks.md
    description: План реализации — чекбоксы, сгруппированные по репозиториям
    template: tasks.md
    instruction: >
      Создай список задач реализации. Пиши по-русски.


      Перед этим проверь «Открытые вопросы» в design.md: если какой-то из них
      меняет состав работ — сначала реши его с пользователем, не зашивай
      негласное предположение в план.


      ВАЖНО: формат чекбоксов парсится фазой apply — строго `- [ ] X.Y Описание`,
      группы — нумерованные заголовки `##`. Задача без чекбокса не трекается.


      Группировка для Rivet: по репозиториям в порядке зависимости — сначала
      `## N. rivet (бэкенд)`, затем `rivet-web`, `rivet-android`, `rivet-ios`
      (группы для незатронутых репозиториев не создавай), последней — группа
      «Проверка»: прогон тестов, сверка реализации со сценариями спек и, для
      консоли, с дизайн-прототипом.


      Задачи — небольшие (одна сессия), проверяемые (понятно, когда готово),
      упорядоченные по зависимостям. Ссылайся на спеки (что строим) и design
      (как строим).
    requires:
      - specs
      - design
      - api-contract
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Прочитай артефакты изменения, выполняй задачи из tasks.md по порядку и
    отмечай выполненные по ходу. Работая в клиентских репозиториях
    (rivet-web/android/ios), сверяйся с api-contract.md и спеками из rivet.
    Останавливайся при блокерах и неоднозначностях — спроси пользователя.
