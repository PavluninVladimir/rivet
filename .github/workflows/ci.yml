name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - run: go build ./...
      - run: go test ./...
        env:
          RIVET_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet?sslmode=disable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: rivet-service

  # Короткий фаззинг-smoke: ловит регрессии по корпусу и свежие крэши.
  # Таргеты — чистые функции, БД не нужна.
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - run: make fuzz FUZZ_TIME=15s
