name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - run: go build ./...
      - run: go test ./...
        env:
          RIVET_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet?sslmode=disable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: rivet-service

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: rivet-web
      - run: npx playwright install --with-deps chromium
        working-directory: rivet-web
      - run: npx playwright test
        working-directory: rivet-web
        env:
          RIVET_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet?sslmode=disable
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            rivet-web/playwright-report
            rivet-web/test-results
