name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Ручной перезапуск: прогон после сбоя GitHub Actions иначе не повторить.
  workflow_dispatch:

# Токену workflow хватает чтения: прогон ничего не публикует.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - run: go build ./...
      - run: go test ./...
        env:
          RIVET_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet?sslmode=disable
      # Версия закреплена: с latest новые проверки приходили в CI раньше,
      # чем локально. Обновление отдельным PR вместе с исправлениями
      # находок; локально та же версия: go install
      # github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: rivet-service

  # Встроенная консоль: internal/webui/dist совпадает со сборкой коммита
  # main rivet-web из internal/webui/REVISION. Обновление: make ui-sync в
  # rivet-service. Node той же версии, что в CI rivet-web: сборка сверяется
  # побайтно.
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make ui-check

  # Короткий фаззинг-smoke: ловит регрессии по корпусу и свежие крэши.
  # Таргеты — чистые функции, БД не нужна.
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - run: make fuzz FUZZ_TIME=15s

  # Сканер секретов по всей истории: в репозитории не должно быть настоящих
  # ключей и токенов. Выдуманные значения тестов исключены в .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action на pull_request читает список коммитов PR через API:
    # в приватном репозитории без pull-requests: read запрос получит 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Версия, на которой проверены исключения .gitleaks.toml.
          GITLEAKS_VERSION: 8.30.1

  # Лицензии зависимостей: копилефт, запрещённые лицензии и пакеты без
  # лицензии роняют сборку; NOTICE и THIRD_PARTY должны совпадать с go.mod
  # (make third-party в rivet-service).
  licenses:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: >-
          go-licenses check ./...
          --ignore github.com/PavluninVladimir/rivet
          --disallowed_types=forbidden,restricted,reciprocal,unknown
      - run: python3 scripts/third_party.py --check

  # Известные уязвимости в зависимостях и стандартной библиотеке, которые
  # достижимы из кода Rivet.
  vulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
      - run: govulncheck ./...

  local-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivet-service
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet-service/go.mod
      - name: API, очередь, сборка, redeploy и очистка на изолированной БД
        run: go test -v ./internal/runner ./internal/localdocker -run 'TestLocalDockerAPIToContainer|TestDockerLifecycle|TestDockerRecipes' -count=1
        env:
          RIVET_DOCKER_TEST: "1"
          RIVET_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet?sslmode=disable
      # Здесь VM одноразовая. Общий Docker пользователя этот тест не трогает.
      - name: Восстановление после перезапуска Docker
        run: go test -v ./internal/localdocker -run '^TestDockerDaemonRecovery$' -count=1
        env:
          RIVET_DOCKER_DAEMON_RESTART_TEST: "1"
