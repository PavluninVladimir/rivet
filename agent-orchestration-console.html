
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rivet · EPIC-42 · Implement Keycloak authentication</title>
<style>
/* ─── tokens — the only place colors are defined ─────────────────────── */
:root {
  --bg:      oklch(15.5% 0.010 255);
  --surface: oklch(18.5% 0.012 255);
  --fg:      oklch(92% 0.006 255);
  --muted:   oklch(64% 0.014 255);
  --border:  oklch(26.5% 0.013 255);
  --accent:  oklch(67% 0.155 248);   /* one accent = "running / primary action" */

  /* status scale — color carries state, nothing else */
  --c-done:   oklch(70% 0.135 152);
  --c-test:   oklch(74% 0.105 200);
  --c-review: oklch(76% 0.125 85);
  --c-fix:    oklch(72% 0.135 60);
  --c-block:  oklch(66% 0.185 27);
  --c-fail:   oklch(58% 0.185 27);
  --c-queue:  oklch(55% 0.015 255);
  --c-ready:  oklch(70% 0.055 248);
  --c-run:    var(--accent);

  /* derived */
  --raised:      color-mix(in oklch, var(--surface) 88%, white);
  --accent-soft: color-mix(in oklch, var(--accent) 15%, transparent);
  --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);
  --term-bg:     color-mix(in oklch, var(--bg) 72%, black);
  --shadow:      0 8px 32px oklch(0% 0 0 / .5);

  /* type — utilitarian tool: display face = UI sans by design */
  --font-ui:      -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-display: var(--font-ui);
  --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;

  --fs-body: 13px;
  --fs-meta: 11.5px;
  --r: 6px; --r-lg: 8px;
}

/* ─── reset ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 var(--fs-body)/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
h1,h2,h3,h4 { margin: 0; font-family: var(--font-display); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ─── app shell ──────────────────────────────────────────────────────── */
#app { display: grid; grid-template-columns: 200px 1fr; height: 100vh; }

/* sidebar */
#sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); }
.side-brand { display: flex; align-items: center; gap: 8px; padding: 14px 14px 12px; }
.side-brand .glyph {
  width: 20px; height: 20px; border-radius: 5px; background: var(--accent);
  display: grid; place-items: center; color: var(--bg); font: 700 11px var(--font-mono);
}
.side-brand b { font-size: 13.5px; letter-spacing: -0.01em; }
.side-brand .env { margin-left: auto; font: 500 9.5px var(--font-mono); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
#sidebar nav { padding: 4px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: var(--r);
  color: var(--muted); font-weight: 500; font-size: 12.5px; text-align: left; width: 100%;
}
.nav-item svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; flex: none; }
.nav-item:hover { color: var(--fg); background: var(--fg-soft); }
.nav-item.active { color: var(--fg); background: var(--fg-soft); box-shadow: inset 2px 0 0 var(--accent); }
.nav-item .count { margin-left: auto; font: 500 10px var(--font-mono); color: var(--muted); }
.nav-item .count.warn { color: var(--c-block); }
.side-foot { margin-top: auto; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
.side-foot .line { display: flex; align-items: center; gap: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--c-done); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* main column */
#main { display: flex; flex-direction: column; min-width: 0; }
#topbar {
  display: flex; align-items: center; gap: 12px; height: 42px; flex: none;
  padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--surface);
}
.crumb { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.crumb .sep { opacity: .45; }
.crumb b { color: var(--fg); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kbtn {
  margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted);
  border: 1px solid var(--border); border-radius: var(--r); padding: 4px 9px; font-size: 12px;
}
.kbtn:hover { color: var(--fg); border-color: color-mix(in oklch, var(--border) 40%, var(--muted)); }
.kbd { font: 500 10px var(--font-mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 1px 4px; color: var(--muted); }

#viewport { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: none; overflow: auto; }
.view.on { display: block; }
#view-epic.on { display: flex; flex-direction: column; overflow: hidden; }

/* ─── buttons / pills ────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
  border-radius: var(--r); border: 1px solid var(--border); background: var(--raised);
  font-size: 12px; font-weight: 500; box-shadow: 0 1px 2px oklch(0% 0 0 / .3);
  transition: border-color .12s, background .12s;
}
.btn:hover { border-color: color-mix(in oklch, var(--border) 30%, var(--muted)); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.btn.primary:hover { background: color-mix(in oklch, var(--accent) 88%, white); }
.btn.sm { padding: 3px 8px; font-size: 11.5px; }
.btn.icon { padding: 5px 7px; }

.st {
  display: inline-flex; align-items: center; gap: 5px;
  font: 600 9.5px var(--font-mono); letter-spacing: .07em; white-space: nowrap;
}
.st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-running, .st-fixing { color: var(--c-run); }
.st-running::before, .st-testing::before, .st-fixing::before { animation: pulse 1.4s infinite; }
.st-testing { color: var(--c-test); }
.st-review  { color: var(--c-review); }
.st-blocked { color: var(--c-block); }
.st-failed  { color: var(--c-fail); }
.st-done    { color: var(--c-done); }
.st-queued  { color: var(--c-queue); }
.st-ready   { color: var(--c-ready); }
.st-idle, .st-offline { color: var(--c-queue); }
.st-offline::before { background: transparent; border: 1px solid currentColor; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px;
  border: 1px solid var(--border); border-radius: 999px; font-size: 11.5px; color: var(--muted);
}
.chip .n { font: 600 11px var(--font-mono); color: var(--fg); }

/* ─── epic header ────────────────────────────────────────────────────── */
.epic-head { flex: none; padding: 14px 18px 12px; border-bottom: 1px solid var(--border); }
.epic-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.epic-id { font: 600 11px var(--font-mono); color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 7px; }
.epic-title-row h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.epic-actions { margin-left: auto; display: flex; gap: 7px; }
.epic-meta-row { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.progress { display: flex; width: 260px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--fg-soft); }
.progress i { display: block; height: 100%; }
.epic-meta-row .pct { font: 600 13px var(--font-mono); }
.epic-meta-row .sub { font-size: 12px; color: var(--muted); }
.epic-chips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }

/* ─── needs attention ────────────────────────────────────────────────── */
.attention { flex: none; padding: 10px 18px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--c-block) 4%, var(--bg)); }
.attention-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.attention-head h2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.attention-head .n { font: 600 10.5px var(--font-mono); color: var(--c-block); background: color-mix(in oklch, var(--c-block) 16%, transparent); border-radius: 999px; padding: 1px 7px; }
.attention-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.att-card {
  display: flex; flex-direction: column; gap: 4px; padding: 9px 11px;
  background: var(--surface); border: 1px solid var(--border); border-left: 2px solid var(--c-block);
  border-radius: var(--r); text-align: left; min-width: 0;
}
.att-card:hover { border-color: color-mix(in oklch, var(--border) 40%, var(--muted)); border-left-color: var(--c-block); }
.att-card.warn { border-left-color: var(--c-review); }
.att-top { display: flex; align-items: center; gap: 8px; }
.att-top .tid { font: 600 11px var(--font-mono); }
.att-reason { font: 600 9.5px var(--font-mono); letter-spacing: .06em; color: var(--c-block); }
.att-card.warn .att-reason { color: var(--c-review); }
.att-msg { font-size: 12px; color: var(--muted); line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.att-act { margin-top: 2px; font-size: 11.5px; font-weight: 500; color: var(--accent); }

/* ─── epic body: dag + rail ──────────────────────────────────────────── */
.epic-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 292px; }

.dag-panel { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
.dag-toolbar {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 12px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.seg button { padding: 4px 10px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--fg-soft); color: var(--fg); }
.seg button + button { border-left: 1px solid var(--border); }
.tglbtn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--border); border-radius: var(--r); font-size: 11.5px; color: var(--muted); }
.tglbtn:hover { color: var(--fg); }
.tglbtn.on { color: var(--fg); border-color: var(--accent); background: var(--accent-soft); }
.dag-toolbar .zoom { margin-left: auto; display: inline-flex; gap: 4px; }

.dag-canvas { flex: 1; position: relative; overflow: hidden; cursor: grab; background:
  radial-gradient(color-mix(in oklch, var(--fg) 5%, transparent) 1px, transparent 1px);
  background-size: 22px 22px; }
.dag-canvas.panning { cursor: grabbing; }
.dag-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.dag-world svg { position: absolute; top: 0; left: 0; overflow: visible; }
.edge { fill: none; stroke: color-mix(in oklch, var(--border) 55%, var(--muted)); stroke-width: 1.2; }
.edge.to-blocked { stroke: color-mix(in oklch, var(--c-block) 55%, transparent); stroke-dasharray: 4 3; }
.edge.done-done { stroke: var(--border); }
.edge.cp-edge { stroke: var(--accent); stroke-width: 1.8; }
.edge.dim, .node.dim { opacity: .13; }

.node {
  position: absolute; width: 204px; height: 66px; padding: 7px 10px 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  display: flex; flex-direction: column; gap: 2px; text-align: left;
  transition: opacity .15s, border-color .12s; box-shadow: 0 1px 3px oklch(0% 0 0 / .25);
}
.node:hover { border-color: color-mix(in oklch, var(--border) 30%, var(--muted)); }
.node.sel { border-color: var(--accent); }
.node.cp { box-shadow: 0 0 0 1px var(--accent), 0 1px 3px oklch(0% 0 0 / .25); }
.node .n-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.node .n-id { font: 600 10.5px var(--font-mono); color: var(--muted); }
.node .n-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .n-meta { display: flex; justify-content: space-between; gap: 8px; font: 400 10px var(--font-mono); color: var(--muted); }
.node .n-meta .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node[data-status="done"] { opacity: .62; }
.node[data-status="done"]:hover { opacity: 1; }
.node[data-status="blocked"] { border-left: 2px solid var(--c-block); }
.node[data-status="running"], .node[data-status="fixing"] { border-left: 2px solid var(--c-run); }
.node[data-status="testing"] { border-left: 2px solid var(--c-test); }
.node[data-status="review"] { border-left: 2px solid var(--c-review); }

/* epic list view */
.epic-list { padding: 12px 16px; overflow: auto; height: 100%; }

/* ─── right rail: runners ────────────────────────────────────────────── */
.rail { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.rail-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; }
.rail-head h2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rail-head .n { font: 600 10.5px var(--font-mono); color: var(--muted); }
.rail-head a { margin-left: auto; font-size: 11.5px; color: var(--accent); cursor: pointer; }
.rail-body { overflow: auto; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 7px; }
.runner-card {
  text-align: left; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--bg); display: flex; flex-direction: column; gap: 6px;
}
.runner-card:hover { border-color: color-mix(in oklch, var(--border) 35%, var(--muted)); }
.rc-top { display: flex; align-items: center; gap: 8px; }
.rc-top .name { font: 600 11.5px var(--font-mono); }
.rc-top .st { margin-left: auto; }
.rc-task { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; }
.rc-task .tid { font: 500 11px var(--font-mono); color: var(--fg); }
.rc-task .dur { font: 400 11px var(--font-mono); color: var(--muted); }
.rc-action { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-foot { display: flex; align-items: center; gap: 8px; font: 400 10px var(--font-mono); color: var(--muted); }
.ctx-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--fg-soft); overflow: hidden; }
.ctx-bar i { display: block; height: 100%; background: var(--muted); }
.ctx-bar i.hot { background: var(--c-review); }

/* ─── drawer ─────────────────────────────────────────────────────────── */
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 92vw; z-index: 40;
  background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow);
  transform: translateX(102%); transition: transform .18s ease; display: flex; flex-direction: column;
}
#drawer.open { transform: none; }
.dw-head { flex: none; padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
.dw-top { display: flex; align-items: center; gap: 10px; }
.dw-top .tid { font: 600 12px var(--font-mono); color: var(--muted); }
.dw-top .close { margin-left: auto; color: var(--muted); padding: 4px; border-radius: 4px; }
.dw-top .close:hover { color: var(--fg); background: var(--fg-soft); }
.dw-head h2 { font-size: 15px; font-weight: 600; margin-top: 6px; letter-spacing: -0.01em; }
.dw-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.dw-body { flex: 1; overflow: auto; padding: 0 16px 20px; }
.dw-sec { padding-top: 14px; }
.dw-sec > h3 { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.meta-grid .kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--fg-soft); font-size: 12px; }
.meta-grid .kv b { font: 500 11.5px var(--font-mono); color: var(--fg); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-grid .kv span { color: var(--muted); flex: none; }
.crit { display: flex; gap: 9px; padding: 5px 0; font-size: 12.5px; align-items: baseline; }
.crit .m { font: 600 11px var(--font-mono); flex: none; }
.crit.ok .m { color: var(--c-done); }
.crit.pend .m { color: var(--c-queue); }
.tl { border-left: 1px solid var(--border); margin-left: 4px; padding-left: 14px; display: flex; flex-direction: column; gap: 7px; }
.tl-row { display: flex; gap: 10px; font-size: 12px; position: relative; }
.tl-row::before { content: ''; position: absolute; left: -17.5px; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.tl-row.warn::before { background: var(--c-review); }
.tl-row.bad::before { background: var(--c-block); }
.tl-row.now::before { background: var(--c-run); animation: pulse 1.4s infinite; }
.tl-row .t { font: 400 11px var(--font-mono); color: var(--muted); flex: none; width: 38px; }
.live { display: flex; flex-direction: column; gap: 4px; }
.live-row { display: flex; align-items: baseline; gap: 9px; font-size: 12.5px; padding: 2px 0; }
.live-row .m { font: 600 11px var(--font-mono); flex: none; width: 12px; }
.live-row.ok .m { color: var(--c-done); }
.live-row.bad .m { color: var(--c-block); }
.live-row.now .m { color: var(--c-run); animation: pulse 1.2s infinite; }
.live-row .d { margin-left: auto; font: 400 10.5px var(--font-mono); color: var(--muted); }
.term {
  margin-top: 8px; background: var(--term-bg); border: 1px solid var(--border); border-radius: var(--r);
  padding: 10px 12px; font: 400 11px/1.6 var(--font-mono); color: var(--muted);
  white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto;
}
.term .ok { color: var(--c-done); } .term .bad { color: var(--c-block); } .term .cmd { color: var(--fg); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font: 500 10.5px var(--font-mono); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; }

/* ─── generic page + tables ──────────────────────────────────────────── */
.page { padding: 16px 20px 28px; max-width: 1160px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.page-head h1 { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
.page-head .sub { font-size: 12px; color: var(--muted); }
.page-head .right { margin-left: auto; display: flex; gap: 7px; align-items: center; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font: 500 10px var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid color-mix(in oklch, var(--border) 55%, transparent); vertical-align: middle; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover { background: var(--fg-soft); }
.tbl .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tbl .id { font: 500 11.5px var(--font-mono); }
.bar-cell { display: flex; align-items: center; gap: 8px; }
.bar-cell .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--fg-soft); overflow: hidden; min-width: 60px; }
.bar-cell .bar i { display: block; height: 100%; background: var(--muted); }
.filters { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.sel { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r); padding: 4px 8px; font-size: 12px; color: var(--fg); }
.search { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r); padding: 4px 10px; font-size: 12px; color: var(--fg); width: 180px; }
.search:focus, .sel:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

/* stat strip (usage) — deliberately small */
.stat-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 16px; }
.mini-stat { border: 1px solid var(--border); border-radius: var(--r-lg); padding: 9px 12px; background: var(--surface); }
.mini-stat .v { font: 600 16px var(--font-mono); letter-spacing: -0.02em; }
.mini-stat .v em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 3px; }
.mini-stat .l { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.mini-stat.hl { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); }

/* ════════ DAG ════════ */
const NW=204, NH=66, GX=64, GY=16, PAD=28;
let pos={}, edges=[], worldW=0, worldH=0;
const view = {x:0,y:0,k:1};
const world = $('#dag-world'), canvas = $('#dag-canvas');
const CPS = {
  'EPIC-41':['TASK-101','TASK-102','TASK-103','TASK-107','TASK-108','TASK-111','TASK-112'],
  'EPIC-42':['TASK-118','TASK-119','TASK-121','TASK-122','TASK-123','TASK-125'],
  'EPIC-43':['TASK-136','TASK-138','TASK-140','TASK-144','TASK-147','TASK-151'],
  'EPIC-44':['TASK-152','TASK-153','TASK-155','TASK-157','TASK-160'],
};

function buildDag(){
  const ts = epTasks();
  pos = {};
  const memo={};
  const L=t=> memo[t.id] ?? (memo[t.id] = t.deps.length ? 1+Math.max(...t.deps.map(d=>L(Tk(d)))) : 0);
  ts.forEach(L);
  const layers={};
  ts.forEach(t=>{ (layers[memo[t.id]] ||= []).push(t); });
  const maxCount = Math.max(...Object.values(layers).map(a=>a.length));
  const maxH = maxCount*NH + (maxCount-1)*GY;
  Object.entries(layers).forEach(([li,arr])=>{
    const totalH = arr.length*NH + (arr.length-1)*GY;
    arr.forEach((t,i)=>{ pos[t.id] = { x: PAD + li*(NW+GX), y: PAD + (maxH-totalH)/2 + i*(NH+GY) }; });
  });
  const nLayers = Math.max(...Object.keys(layers).map(Number))+1;
  worldW = PAD*2 + nLayers*NW + (nLayers-1)*GX;
  worldH = PAD*2 + maxH;
  world.style.width = worldW+'px'; world.style.height = worldH+'px';

  let paths='';
  ts.forEach(t=> t.deps.forEach(d=>{
    const a=pos[d], b=pos[t.id];
    const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2, mx=(x1+x2)/2;
    let cls='edge';
    if(t.s==='blocked') cls+=' to-blocked';
    else if(t.s==='done' && Tk(d).s==='done') cls+=' done-done';
    paths += `<path class="${cls}" data-from="${d}" data-to="${t.id}" d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"/>`;
  }));
  world.innerHTML = `<svg width="${worldW}" height="${worldH}">${paths}</svg>` + ts.map(t=>{
    const p=pos[t.id];
    const dur = t.live!=null ? `<span class="n-dur" data-live-sec="${t.live}">${fmt(t.live)}</span>` : (t.dur||'—');
    const who = t.r==='—' ? (t.m||'') : `${t.r} · ${t.m}`;
    return `<button class="node" data-status="${t.s}" data-task="${t.id}" data-od-id="node-${t.id.toLowerCase()}" style="left:${p.x}px;top:${p.y}px">
      <span class="n-top"><span class="n-id">${t.id}</span>${stHtml(t.s)}</span>
      <span class="n-title">${t.t}</span>
      <span class="n-meta"><span class="who">${who}</span>${dur}</span></button>`;
  }).join('');
}
function applyView(){ world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
function fit(){
  const r = canvas.getBoundingClientRect();
  view.k = Math.min((r.width-24)/worldW, (r.height-24)/worldH, 1.15);
  view.x = (r.width - worldW*view.k)/2; view.y = (r.height - worldH*view.k)/2;
  applyView();
}
function zoomAt(f, px, py){
  const k2 = Math.min(2.2, Math.max(0.3, view.k*f)); f = k2/view.k;
  view.x = px-(px-view.x)*f; view.y = py-(py-view.y)*f; view.k = k2; applyView();
}
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*0.0016), e.clientX-r.left, e.clientY-r.top);
},{passive:false});
let drag=null;
canvas.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}; canvas.classList.add('panning'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e=>{ if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
  view.x=drag.vx+dx; view.y=drag.vy+dy; applyView(); });
canvas.addEventListener('pointerup', e=>{
  const wasDrag = drag && drag.moved; drag=null; canvas.classList.remove('panning');
  if(!wasDrag){ const n=e.target.closest('.node'); if(n) openTask(n.dataset.task); }
});
$('#z-in').onclick = ()=>{ const r=canvas.getBoundingClientRect(); zoomAt(1.25, r.width/2, r.height/2); };
$('#z-out').onclick = ()=>{ const r=canvas.getBoundingClientRect(); zoomAt(0.8, r.width/2, r.height/2); };
$('#z-fit').onclick = fit;

/* dag filters */
const dagState = { f:'all', hideDone:false, cp:false };
const FMATCH = { all:()=>true, active:t=>['running','testing','fixing','ready','queued'].includes(t.s),
  review:t=>t.s==='review', blocked:t=>['blocked','failed'].includes(t.s), done:t=>t.s==='done' };
function applyFilters(){
  const vis = {}, cp = CPS[curEpic] || [];
  epTasks().forEach(t=>{ vis[t.id] = FMATCH[dagState.f](t) && !(dagState.hideDone && t.s==='done'); });
  world.querySelectorAll('.node').forEach(n=>{
    n.classList.toggle('dim', !vis[n.dataset.task]);
    n.classList.toggle('cp', dagState.cp && cp.includes(n.dataset.task));
  });
  world.querySelectorAll('.edge').forEach(p=>{
    p.classList.toggle('dim', !(vis[p.dataset.from] && vis[p.dataset.to]));
    const i = cp.indexOf(p.dataset.from);
    p.classList.toggle('cp-edge', dagState.cp && i>-1 && cp[i+1]===p.dataset.to);
  });
}

  const t = r.task ? Tk(r.task) : null;
  const head = `
    <div class="dw-top"><span class="tid">${r.id}</span>${stHtml(r.s)}<button class="close" title="Close (Esc)">✕</button></div>
    <h2>${r.agent} · ${r.model}</h2>
    <div class="dw-actions">
      <button class="btn sm" data-toast="${r.id}: pause requested">Pause</button>
      <button class="btn sm" data-toast="${r.id}: drain — will stop after current task">Drain</button>
      <button class="btn sm" data-toast="${r.id}: restart requested">Restart</button>
    </div>`;
  let body = `<div class="dw-sec"><div class="meta-grid">
      ${kv('Agent', r.agent)}${kv('Model', r.model)}${kv('Host', r.host)}
      ${kv('Task', r.task)}${kv('Tokens (session)', r.tok!=='—'?r.tok:null)}
      ${kv('Runtime', r.rt?`<span data-live-sec="${r.rt}">${fmt(r.rt)}</span>`:null)}
    </div></div>`;
  if(r.s!=='offline' && r.s!=='idle') body += `<div class="dw-sec"><h3>Context usage</h3>
    <div class="rc-foot" style="font-size:11px"><div class="ctx-bar" style="height:5px"><i class="${r.ctx>60?'hot':''}" style="width:${r.ctx}%"></i></div><span class="mono">${r.ctx}%</span></div></div>`;
  body += `<div class="dw-sec"><h3>Current action</h3><div style="font-size:12.5px" class="mono">${r.act}</div></div>`;
  body += `<div class="dw-sec"><h3>Capabilities</h3><div class="tags">${r.caps.map(c=>`<span class="tag">${c}</span>`).join('')}</div>
    <div class="muted" style="font-size:11px;margin-top:8px">Used by the scheduler to match tasks to runners.</div></div>`;
  if(t) body += `<div class="dw-sec"><h3>Assigned task</h3>
    <button class="btn sm" data-open-task="${t.id}">${t.id} · ${t.t} →</button></div>`;
  drawerShell(head, body);
}

/* ════════ command palette ════════ */
const COMMANDS = [
 {l:'Create Epic',hint:'⇧⌘E',run:()=>toast('New epic form (demo)')},
 {l:'Create Task',hint:'⇧⌘T',run:()=>toast('New task form (demo)')},
 {l:'Pause Epic — EPIC-42',run:()=>toast('EPIC-42 paused')},
 {l:'Resume Epic — EPIC-42',run:()=>toast('EPIC-42 resumed')},
 {l:'Retry Task…',run:()=>toast('Pick a failed task to retry')},
 {l:'Assign Runner…',run:()=>toast('Runner assignment (demo)')},
 {l:'Open Logs — TASK-123',run:()=>{ show('epic'); openTask('TASK-123'); }},
 {l:'Open Pull Request — #183',run:()=>toast('Opening PR #183…')},
 {l:'Go to Projects',run:()=>show('projects')},
 {l:'Go to Epics',run:()=>show('epics')},
 {l:'Go to Runners',run:()=>show('runners')},
 {l:'Go to Activity',run:()=>show('activity')},
 {l:'Go to Usage',run:()=>show('usage')},
];
const palWrap=$('#pal-wrap'), palInput=$('#pal-input'), palList=$('#pal-list');
let palIdx=0, palItems=[];
function palOpen(){ palWrap.classList.add('open'); palInput.value=''; palRender(''); palInput.focus(); }
function palClose(){ palWrap.classList.remove('open'); }
function palRender(q){
  q=q.trim().toLowerCase();
  const match = s => !q || s.toLowerCase().includes(q);
  palItems=[];
  let html='';
  const cmds = COMMANDS.filter(c=>match(c.l));
  if(cmds.length){ html+='<div class="pal-group">Commands</div>'+cmds.map(c=>{ palItems.push({run:c.run});
    return `<div class="pal-item" data-pi="${palItems.length-1}">${c.l}${c.hint?`<span class="hint">${c.hint}</span>`:''}</div>`; }).join(''); }
  const ts = TASKS.filter(t=>match(t.id)||match(t.t)).slice(0,6);
  if(ts.length){ html+='<div class="pal-group">Tasks</div>'+ts.map(t=>{ palItems.push({run:()=>{ show('epic'); openTask(t.id); }});
    return `<div class="pal-item" data-pi="${palItems.length-1}"><span class="mono">${t.id}</span>${t.t}<span class="hint">${stHtml(t.s)}</span></div>`; }).join(''); }
  const rs = RUNNERS.filter(r=>match(r.id)||match(r.agent)).slice(0,4);
  if(rs.length){ html+='<div class="pal-group">Runners</div>'+rs.map(r=>{ palItems.push({run:()=>{ show('runners'); openRunner(r.id); }});
    return `<div class="pal-item" data-pi="${palItems.length-1}"><span class="mono">${r.id}</span>${r.agent} · ${r.model}<span class="hint">${stHtml(r.s)}</span></div>`; }).join(''); }
  const es = EPICS.filter(e=>match(e.id)||match(e.t)).slice(0,4);
  if(es.length){ html+='<div class="pal-group">Epics</div>'+es.map(e=>{ palItems.push({run:()=>openEpic(e.id)});
    return `<div class="pal-item" data-pi="${palItems.length-1}"><span class="mono">${e.id}</span>${e.t}<span class="hint">${e.pct}%</span></div>`; }).join(''); }
  palList.innerHTML = html || '<div class="pal-group">No results</div>';
  palIdx=0; palHi();
}
function palHi(){ palList.querySelectorAll('.pal-item').forEach((n,i)=>n.classList.toggle('sel', i===palIdx)); }
palInput.addEventListener('input', ()=>palRender(palInput.value));
palInput.addEventListener('keydown', e=>{
  const n=palList.querySelectorAll('.pal-item').length;
  if(e.key==='ArrowDown'){ e.preventDefault(); palIdx=Math.min(n-1,palIdx+1); palHi(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); palIdx=Math.max(0,palIdx-1); palHi(); }
  else if(e.key==='Enter'){ const it=palItems[palIdx]; if(it){ palClose(); it.run(); } }
});
palList.addEventListener('click', e=>{ const n=e.target.closest('[data-pi]'); if(n){ palClose(); palItems[+n.dataset.pi].run(); } });
palWrap.addEventListener('click', e=>{ if(e.target===palWrap) palClose(); });
$('#open-pal').onclick = palOpen;
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); palWrap.classList.contains('open')?palClose():palOpen(); }
  else if(e.key==='Escape'){ if(palWrap.classList.contains('open')) palClose(); else closeDrawer(); }
});
